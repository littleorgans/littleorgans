[package]
name = "lilo-im-store"
description = "Identity Matters audit storage: backend-neutral AuditSink contract with a feature-gated Postgres audit store and filtered query API"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["iam", "authorization", "audit", "principal"]
categories = ["authentication"]

[lib]
name = "lilo_im_store"
path = "src/lib.rs"

[dependencies]
chrono.workspace = true
lilo-common = { path = "../lilo-common", version = "0.8.0" }
lilo-im-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[features]
# Default features are empty: the published default surface is the sqlx-free
# audit contract re-exported from lilo-im-core (AuditSink/AuditRow/AuditError).
# The `postgres` backend compiles the concrete `AuditStore` and pulls in sqlx.
postgres = ["dep:sqlx"]

[dev-dependencies]
lilo-im-stub.workspace = true
insta.workspace = true
nix.workspace = true
tempfile.workspace = true

[lints]
workspace = true
