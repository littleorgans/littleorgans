# Local Postgres service for lilo-db development and `cargo test -p lilo-db`.
# Operator/test URL: postgres://lilo:lilo@localhost:5432/lilo
#
#   docker compose up -d --wait postgres
#
# Disposable local data only; the named volume can be removed at any time.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lilo
      POSTGRES_PASSWORD: lilo
      POSTGRES_DB: lilo
    ports:
      - "5432:5432"
    volumes:
      - lilo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lilo -d lilo"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  lilo-postgres-data:
