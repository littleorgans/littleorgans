---
name: PR

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel a superseded run when the same PR or branch gets a new push,
# so updating a PR branch never leaves two gates running at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    name: PR gate
    # GitHub PR merges into main are committed by web-flow and use either
    # "Merge pull request #N" or squash/rebase "(#N)" messages.
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !(
          github.event.head_commit.committer.username == 'web-flow' &&
          (
            startsWith(github.event.head_commit.message, 'Merge pull request #') ||
            contains(github.event.head_commit.message, '(#')
          )
        )
      )
    runs-on: ubuntu-latest
    # Both vars resolve to the health-checked postgres service below. They make
    # the lilo-db Postgres tests run in the gate (instead of skipping as they do
    # locally without a database) and give `lilo doctor` a real backend. The CI
    # runner's host 5432 is free; the 55432 local-dev override is unrelated.
    env:
      LILO_DATABASE_URL: postgres://lilo:lilo@localhost:5432/lilo
      LILO_TEST_DATABASE_URL: postgres://lilo:lilo@localhost:5432/lilo
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lilo
          POSTGRES_PASSWORD: lilo
          POSTGRES_DB: lilo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lilo -d lilo"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95
        with:
          components: clippy, rustfmt

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Install Moon toolchain
        uses: moonrepo/setup-toolchain@v0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # The committed .cargo/config.toml sets -fuse-ld=mold for
      # x86_64-unknown-linux-gnu, so the linker must be on PATH before any build.
      - name: Install mold linker
        uses: rui314/setup-mold@v1

      # Single CI gate: moon ci runs fmt-check, clippy, build, nextest test,
      # and the LOC/provenance checks (all runInCI tasks in moon.yml).
      - name: Moon CI
        run: moon ci

      # The lilo-db Postgres tests are #[ignore]d (so the default suite skips
      # them honestly when no DB is present). The job env + postgres service
      # above make them run for real here against localhost:5432.
      - name: lilo-db Postgres tests
        run: cargo nextest run -p lilo-db --run-ignored all

      - name: Lilo binary smoke test
        run: |
          ./target/debug/lilo --version
          ./target/debug/lilo doctor --output json | jq .
