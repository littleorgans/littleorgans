[alias]
xtask = "run -p xtask --"

# Faster linkers, applied per host triple so each environment uses what it has.
# macOS arm64 (local): LLVM lld (`brew install lld`). Linux (CI + linux dev):
# mold, installed in CI via rui314/setup-mold in .github/workflows/pr.yml. mold
# cannot link Mach-O, so it stays Linux-only. These rustflags change the build
# fingerprint, so the first build per target dir after this relinks once.
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]
