[package]
name = "lilo-db"
description = "Internal shared Postgres pool for composed littleorgans daemons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
name = "lilo_db"
path = "src/lib.rs"

[features]
# Exposes the Postgres `TestDb` fixture (and `now_micros`) to other crates'
# tests. The fixtures are always available inside this crate's own tests via
# `cfg(test)`; `chrono` powers the microsecond-precision time helper.
test-support = ["dep:chrono"]

[dependencies]
anyhow.workspace = true
chrono = { workspace = true, optional = true }
lilo-paths.workspace = true
sqlx.workspace = true
tokio.workspace = true

[dev-dependencies]
chrono.workspace = true
tempfile.workspace = true

[lints]
workspace = true
