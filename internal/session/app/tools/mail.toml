[tools.mail_send]
cli_name        = "mail send"
mcp_description = "Send durable mail to running sessions selected by selector."
cli_about       = "Send durable mail to selected running sessions."
mcp_namespace_scope = true
output_schema   = '''
{
  "type": "object",
  "required": ["results"],
  "properties": {
    "results": {"type": "array", "items": {"type": "object"}},
    "errors": {"type": "array", "items": {"type": "object"}}
  }
}
'''

[[tools.mail_send.params]]
name            = "to"
type            = "string"
required        = true
mcp_description = "Recipient selector used for matching running sessions."
cli_help        = "Recipient selector used for matching running sessions."
cli_flag        = "--to"
selector        = true

[[tools.mail_send.params]]
name            = "content"
type            = "string"
required        = true
mcp_description = "Message content."
cli_help        = "Message content."
cli_flag        = "--content"

[[tools.mail_send.params]]
name            = "notify"
type            = "string"
required        = false
enum_values     = ["wait", "steer"]
mcp_description = "Optional wake mode to request after mail persistence: wait or steer."
cli_help        = "Optional wake mode to request after mail persistence. Bare --notify uses wait."
cli_flag        = "--notify"

[[tools.mail_send.params]]
name            = "context_id"
type            = "string"
required        = true
mcp_description = "Conversation correlation tag."
cli_help        = "Conversation correlation tag."
cli_flag        = "--context-id"

[[tools.mail_send.params]]
name            = "intent"
type            = "string"
required        = true
enum_values     = ["request", "result", "inform"]
mcp_description = "Message intent tag. Receipt is reserved for daemon system messages."
cli_help        = "Message intent tag: request, result, or inform."
cli_flag        = "--intent"

[[tools.mail_send.params]]
name            = "idempotency_key"
type            = "string"
required        = false
mcp_description = "Optional client idempotency key scoped to the derived sender."
cli_help        = "Optional client idempotency key scoped to the derived sender."
cli_flag        = "--idempotency-key"

[tools.mail_read]
cli_name        = "mail read"
mcp_description = "Read unread mail for the caller session. Reads mark messages read."
cli_about       = "Read unread mail for the caller session."
output_schema   = '''
{
  "type": "object",
  "required": ["messages"],
  "properties": {
    "messages": {"type": "array", "items": {"type": "object"}},
    "errors": {"type": "array", "items": {"type": "object"}}
  }
}
'''

[tools.mail_peek]
cli_name        = "mail peek"
mcp_description = "Peek at the operator message transcript without draining mail."
cli_about       = "Peek at the operator message transcript without draining mail."
mcp_namespace_scope = true
output_schema   = '''
{
  "type": "object",
  "required": ["messages"],
  "properties": {
    "messages": {"type": "array", "items": {"type": "object"}},
    "cursor": {"type": ["object", "null"]}
  }
}
'''

[[tools.mail_peek.params]]
name            = "context_id"
type            = "string"
required        = false
mcp_description = "Conversation correlation tag to inspect."
cli_help        = "Conversation correlation tag to inspect."
cli_flag        = "--context-id"

[[tools.mail_peek.params]]
name            = "selector"
type            = "string"
required        = false
mcp_description = "Participant selector used for matching messages."
cli_help        = "Participant selector used for matching messages."
cli_flag        = "--selector"
selector        = true

[[tools.mail_peek.params]]
name            = "recipient"
type            = "string"
required        = false
mcp_description = "Recipient selector used for matching mailboxes."
cli_help        = "Recipient selector used for matching mailboxes."
cli_flag        = "--recipient"
selector        = true

[[tools.mail_peek.params]]
name            = "include_system"
type            = "boolean"
required        = false
mcp_description = "Include system receipt metadata in the transcript."
cli_help        = "Include system receipt metadata in the transcript."
cli_flag        = "--include-system"

[tools.mail_check]
cli_name        = "mail check"
mcp_description = "Return the unread mail count for sessions selected by selector without draining mail."
cli_about       = "Return unread mail count for selected sessions."
mcp_namespace_scope = true
output_schema   = '''
{
  "type": "object",
  "required": ["unread"],
  "properties": {
    "unread": {"type": "integer"},
    "counts": {"type": "array", "items": {"type": "object"}}
  }
}
'''

[[tools.mail_check.params]]
name            = "selector"
type            = "string"
required        = true
mcp_description = "Inbox owner selector used for matching sessions."
cli_help        = "Inbox owner selector used for matching sessions."
cli_flag        = "--selector"
selector        = true

[tools.mail_tail]
cli_name        = "mail tail"
mcp_description = "Follow the operator message transcript via append events without draining mail."
cli_about       = "Follow the operator message transcript without draining mail."
mcp_namespace_scope = true
output_schema   = '''
{
  "type": "object",
  "required": ["messages"],
  "properties": {
    "messages": {"type": "array", "items": {"type": "object"}},
    "cursor": {"type": ["object", "null"]}
  }
}
'''

[[tools.mail_tail.params]]
name            = "context_id"
type            = "string"
required        = false
mcp_description = "Conversation correlation tag to follow."
cli_flag        = "--context-id"

[[tools.mail_tail.params]]
name            = "selector"
type            = "string"
required        = false
mcp_description = "Participant selector used for matching messages."
cli_flag        = "--selector"
selector        = true

[[tools.mail_tail.params]]
name            = "recipient"
type            = "string"
required        = false
mcp_description = "Recipient selector used for matching mailboxes."
cli_flag        = "--recipient"
selector        = true

[[tools.mail_tail.params]]
name            = "include_system"
type            = "boolean"
required        = false
mcp_description = "Include system receipt metadata in the transcript."
cli_flag        = "--include-system"

[[tools.mail_tail.params]]
name            = "once"
type            = "boolean"
required        = false
mcp_description = "Return immediately after the current transcript batch."
cli_help        = "Return immediately after the current transcript batch."
cli_flag        = "--once"

[tools.mail_stop_check]
cli_name        = "mail stop-check"
mcp_description = "Return the unread mail count for stop-hook decisions without draining mail."
cli_about       = "Check unread mail for stop-hook decisions."
mcp_namespace_scope = true
output_schema   = '''
{
  "type": "object",
  "required": ["unread"],
  "properties": {
    "unread": {"type": "integer"},
    "counts": {"type": "array", "items": {"type": "object"}}
  }
}
'''

[[tools.mail_stop_check.params]]
name            = "selector"
type            = "string"
required        = true
mcp_description = "Inbox owner selector used for matching sessions."
cli_help        = "Inbox owner selector used for matching sessions."
cli_flag        = "--selector"
selector        = true
